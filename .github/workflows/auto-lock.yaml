name: Auto-Lock Images

on:
  push:
    branches: ["**"]
    paths:
      - "**/build.yaml"
  workflow_dispatch:

jobs:
  lock:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install Skopeo
        run: |
          sudo apt-get update
          sudo apt-get install -y skopeo

      - name: Run Locker Script
        run: python3 scripts/lock_builds.py

      - name: Pull and Check for changes
        id: git-check
        run: |
          git pull --rebase origin ${{ github.ref_name }}
          if [ -n "$(git status --porcelain)" ]; then
            echo "changed=true" >> $GITHUB_OUTPUT
          else
            echo "changed=false" >> $GITHUB_OUTPUT
          fi

      - name: Commit and Push changes
        if: steps.git-check.outputs.changed == 'true'
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: pin docker digests in build.yaml"
          file_pattern: "**/build.yaml docker-lock.json"
